<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Prime Lagos district overview</title>
  <desc id="description">A static map-style overview of Victoria Island, Ikoyi, Banana Island, Lekki Phase 1, and Eko Atlantic.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef2f4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce4e8"/>
      <stop offset="1" stop-color="#cbd6dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10233f" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#water)"/>
  <path d="M0 0h1200v250c-92 24-180 23-267 3-92-21-183-4-274 21-105 29-214 21-319-9-111-32-224-29-340 7V0Z" fill="url(#land)"/>
  <path d="M0 404c130-25 250-17 360 20 103 35 205 36 308 11 123-30 245-24 365 21 58 22 114 30 167 25v199H0Z" fill="#e8edef" opacity=".54"/>

  <g fill="none" stroke="#ffffff" stroke-width="8" opacity=".72">
    <path d="M70 102c170 76 319 88 448 37s276-55 441-11"/>
    <path d="M180 32c72 101 97 185 75 253"/>
    <path d="M481 0c-14 87 5 161 57 224"/>
    <path d="M832 36c-48 69-58 135-30 197"/>
  </g>
  <text x="470" y="214" fill="#68798b" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="2">LAGOS</text>

  <g filter="url(#shadow)" stroke-width="4">
    <path d="M451 385 553 348 632 393 596 470 475 474 421 424Z" fill="#bc9136" fill-opacity=".64" stroke="#7f5b14"/>
    <path d="M570 286 681 294 739 351 700 417 590 402 532 345Z" fill="#2c5f97" fill-opacity=".62" stroke="#173a63"/>
    <path d="M678 315 748 319 782 356 752 391 684 382 651 349Z" fill="#2c5f97" fill-opacity=".74" stroke="#173a63"/>
    <path d="M777 307 935 236 1038 323 1009 444 838 430 748 352Z" fill="#bc9136" fill-opacity=".62" stroke="#7f5b14"/>
    <path d="M374 470 510 465 570 535 535 620 390 630 329 552Z" fill="#2c5f97" fill-opacity=".62" stroke="#173a63"/>
  </g>

  <g fill="#10233f" stroke="#fff" stroke-width="5" paint-order="stroke" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="529" y="421">VICTORIA ISLAND</text>
    <text x="632" y="350">IKOYI</text>
    <text x="716" y="358" font-size="17">BANANA ISLAND</text>
    <text x="892" y="356">LEKKI PHASE 1</text>
    <text x="447" y="552">EKO ATLANTIC</text>
  </g>

  <g transform="translate(52 540)">
    <rect width="244" height="92" rx="22" fill="#fff" fill-opacity=".92"/>
    <text x="24" y="36" fill="#10233f" font-family="Arial, sans-serif" font-size="18" font-weight="700">PRIME LAGOS</text>
    <text x="24" y="65" fill="#65758a" font-family="Arial, sans-serif" font-size="15">Static district overview</text>
  </g>
</svg>
